name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install .
      - name: Validate repository
        run: python scripts/validate_skill.py
      - name: Run portable unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Check CLI help
        run: |
          python -m liang_pingfa_review --help
          python -m liang_pingfa_review doctor --help
          python -m liang_pingfa_review audit --help
          python -m liang_pingfa_review plan --help
          python -m liang_pingfa_review review-plan --help
          python -m liang_pingfa_review apply --help
          python -m liang_pingfa_review verify --help
          python -m liang_pingfa_review local-regression --help
      - name: Check forbidden tracked artifacts
        run: python scripts/validate_skill.py --tracked
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install .
      - name: Validate repository
        run: python scripts/validate_skill.py
      - name: Run full Windows suite including native handle tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Check CLI help
        run: |
          python -m liang_pingfa_review --help
          python -m liang_pingfa_review doctor --help
          python -m liang_pingfa_review apply --help
          python -m liang_pingfa_review verify --help
      - name: Check forbidden tracked artifacts
        run: python scripts/validate_skill.py --tracked
