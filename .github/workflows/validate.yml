name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository
        run: python scripts/validate_skill.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Python sources
        run: python -m py_compile scripts/validate_skill.py tests/test_validate_skill.py
      - name: Check forbidden tracked artifacts
        run: python scripts/validate_skill.py --tracked
